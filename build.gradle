plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

def ic2Version = project.findProperty('ic2_version') ?: '2.1.3.4'
def portMajor = project.findProperty('port_major') ?: '1'
def portMinor = project.findProperty('port_minor') ?: '0'
def portPatch = (project.findProperty('port_patch') ?: '1').toInteger()

def releaseTaskNames = ['build', 'assemble', 'reobfJar']
def requestedTasks = gradle.startParameter.taskNames
boolean isReleaseBuild = requestedTasks.any { req ->
    releaseTaskNames.any { rel -> req.contains(rel) }
}
boolean shouldBump = isReleaseBuild && !project.hasProperty('noBump')

int effectivePatch = shouldBump ? portPatch + 1 : portPatch
version = "${ic2Version}-port.${portMajor}.${portMinor}.${effectivePatch}"
group = 'ic2'
archivesBaseName = 'IC2Classic-Port-1.20.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            
            mods {
                ic2 {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'ic2'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'ic2'
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'ic2'
        }

        data {
            args '--mod', 'ic2', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, 'mixins.ic2.refmap.json'
    config 'ic2.mixins.json'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'

    // CarbonConfig - mandatory dependency
    implementation fg.deobf("curse.maven:carbon-config-898104:8119981")

    // Curios API - via CurseMaven (Project 309927, File 6418456)
    compileOnly fg.deobf("curse.maven:curios-309927:6418456")
    runtimeOnly fg.deobf("curse.maven:curios-309927:6418456")

    // The One Probe - via CurseMaven
    implementation fg.deobf("curse.maven:the-one-probe-245211:6106996")

    // JEI - optional dependency
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:15.20.0.106")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:15.20.0.106")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.20.0.106")

    // Mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "Industrial Craft Classic Port",
                "Specification-Vendor"    : "IC2Classic",
                "Specification-Version"   : "1",
                "Implementation-Title"    : "Industrial Craft Classic Port",
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "IC2Classic",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "ic2.mixins.json"
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.matching { it.name == 'reobfJar' }.configureEach {
    mustRunAfter tasks.matching { it.name == 'test' }
}

gradle.buildFinished { result ->
    if (result.failure == null && shouldBump) {
        def propsFile = file('gradle.properties')
        if (propsFile.exists()) {
            def lines = propsFile.readLines('UTF-8')
            def newLines = lines.collect { line ->
                if (line.trim().startsWith('port_patch=')) {
                    return "port_patch=${effectivePatch}"
                }
                return line
            }
            propsFile.withWriter('UTF-8') { writer ->
                newLines.each { writer.writeLine(it) }
            }
            println "Successfully updated gradle.properties: port_patch=${effectivePatch}"
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000'
}
